
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odgs"
version = "6.0.4"
description = "Open Data Governance Standard — Sovereign Validation Engine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Metric Provenance", email = "partner@metricprovenance.com"}]
keywords = ["data-governance", "sovereign", "compliance", "ai-safety", "eu-ai-act", "dora", "gdpr", "csrd", "nis2", "data-quality", "regulatory", "enforcement", "s-cert", "mcp", "maturity-model"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "simpleeval==0.9.13",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "certifi>=2024.2.2",
    "jsonschema>=4.21.1",
    "PyJWT[crypto]>=2.8.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.95.0", "uvicorn>=0.20.0"]
audit = ["GitPython>=3.1.0"]
demo = ["streamlit>=1.30.0", "streamlit-agraph>=0.0.45", "pandas>=2.0.0"]
ai = ["google-genai>=1.0.0", "sse-starlette>=1.0.0"]
llm = ["ollama>=0.4.0", "google-genai>=1.0.0"]
all = ["odgs[demo,ai,server,audit,llm]"]

[project.urls]
Homepage = "https://metricprovenance.com"
Repository = "https://github.com/MetricProvenance/odgs-protocol"
Documentation = "https://github.com/MetricProvenance/odgs-protocol/blob/main/2_INFORMATIVE_REFERENCE/architecture/index.md"
Changelog = "https://github.com/MetricProvenance/odgs-protocol/blob/main/CHANGELOG.md"
Issues = "https://github.com/MetricProvenance/odgs-protocol/issues"
"Sovereign Registry" = "https://registry.metricprovenance.com"
"Research Paper (SSRN)" = "https://papers.ssrn.com/abstract=6205478"

[project.scripts]
odgs = "odgs.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["2_INFORMATIVE_REFERENCE/src/odgs"]
exclude = [
    "2_INFORMATIVE_REFERENCE/src/odgs/ui/",
    "2_INFORMATIVE_REFERENCE/src/odgs/factory/",
    "2_INFORMATIVE_REFERENCE/src/odgs/audit_logs/",
    "2_INFORMATIVE_REFERENCE/src/odgs/sovereign_audit.log",
]

[tool.hatch.build.targets.wheel.sources]
"2_INFORMATIVE_REFERENCE/src" = ""

[tool.hatch.build.targets.sdist]
exclude = [
    "2_INFORMATIVE_REFERENCE/src/odgs/ui/",
    "2_INFORMATIVE_REFERENCE/src/odgs/factory/",
    "2_INFORMATIVE_REFERENCE/src/odgs/audit_logs/",
    "2_INFORMATIVE_REFERENCE/architecture/images/",
    "2_INFORMATIVE_REFERENCE/architecture/research/",
    ".env",
    "deploy/",
    "docker-compose.yml",
    "Dockerfile",
    ".streamlit/",
    "docs/internal/",
    "docs/images/",
    "COMMERCIALIZATION_PLAN.md",
    "PACKAGE_RELEASE_AUDIT.md",
    "OPENSOURCE_RELEASE_CLEANUP.md",
    ".pytest_cache/",
    "tests/.pytest_cache/",
    "**/*.log",
    "**/audit_logs/",
    # AI tool configurations (never ship to PyPI)
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    ".claude/",
    ".gitnexus/",
    ".gemini/",
    ".cursor/",
    ".copilot/",
    # NPM artifacts (Python package only)
    "node_modules/",
    "package.json",
    "package-lock.json",
    ".npmignore",
    "*.tgz",
]
