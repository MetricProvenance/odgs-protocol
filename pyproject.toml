[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odgs"
version = "6.1.0"
description = "Open Data Governance Standard (ODGS) — Runtime Semantic Policy Enforcement & Certification Engine (ISO/IEC 38505, ISO/IEC 25012, W3C ODRL 2.2, Eclipse CAP v2.2.1, Gaia-X DTA)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "ODGS Technical Specification Contributors"}]
keywords = [
    "data-governance",
    "dataspace",
    "iso-38505",
    "iso-25012",
    "odrl",
    "eclipse-cap",
    "gaia-x",
    "idsa",
    "prov-o",
    "oscal",
    "eu-ai-act",
    "s-cert",
    "semantic-certificate"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "simpleeval==0.9.13",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "certifi>=2024.2.2",
    "jsonschema>=4.21.1",
    "PyJWT[crypto]>=2.8.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.95.0", "uvicorn>=0.20.0"]
audit = ["GitPython>=3.1.0"]
dev = ["pytest>=7.4.0", "jwcrypto>=1.5.0", "GitPython>=3.1.0", "mkdocs>=1.5.0", "mkdocs-material>=9.5.0"]
all = ["odgs[server,audit,dev]"]

[project.urls]
Documentation = "https://metricprovenance.github.io/odgs-protocol/"
Repository = "https://github.com/MetricProvenance/odgs-protocol"
Specification = "https://github.com/MetricProvenance/odgs-protocol/blob/main/1_NORMATIVE_SPECIFICATION/SPECIFICATION.md"
Changelog = "https://github.com/MetricProvenance/odgs-protocol/blob/main/CHANGELOG.md"
Issues = "https://github.com/MetricProvenance/odgs-protocol/issues"

[tool.pytest.ini_options]
pythonpath = ["2_INFORMATIVE_REFERENCE/src"]
testpaths = ["tests", "2_INFORMATIVE_REFERENCE/tests/python"]

[project.scripts]
odgs = "odgs.cli:app"
odgs-dataspace = "odgs.dataspace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["2_INFORMATIVE_REFERENCE/src/odgs"]
exclude = [
    "2_INFORMATIVE_REFERENCE/src/odgs/audit_logs/",
    "2_INFORMATIVE_REFERENCE/src/odgs/sovereign_audit.log",
]

[tool.hatch.build.targets.wheel.sources]
"2_INFORMATIVE_REFERENCE/src" = ""

[tool.hatch.build.targets.sdist]
include = [
    "1_NORMATIVE_SPECIFICATION/",
    "2_INFORMATIVE_REFERENCE/src/odgs/",
    "tests/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [
    "2_INFORMATIVE_REFERENCE/src/odgs/audit_logs/",
    "2_INFORMATIVE_REFERENCE/src/odgs/sovereign_audit.log",
    "**/__pycache__/",
    "**/*.pyc",
    "**/*.log",
]
