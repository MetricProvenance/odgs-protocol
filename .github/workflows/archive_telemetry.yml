name: Archive GitHub Traffic Telemetry

on:
    schedule:
        - cron: "0 0 * * *" # Runs every day at midnight UTC
    workflow_dispatch: # Allow manual runs

jobs:
    archive-telemetry:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install requests google-cloud-bigquery

            - name: Run GitHub Traffic Archiver
              env:
                  # A Personal Access Token (PAT) with `repo` scope is required because the default
                  # GITHUB_TOKEN does not have access to clone/traffic APIs for the repository.
                  GH_PAT: ${{ secrets.TELEMETRY_GH_PAT }}
                  # The JSON service account key containing BigQuery access
                  GCP_SA_KEY: ${{ secrets.GCP_TELEMETRY_SA_KEY }}
              run: python .github/scripts/archive_github_traffic.py

            - name: Run PyPI Downloads Archiver
              env:
                  GCP_SA_KEY: ${{ secrets.GCP_TELEMETRY_SA_KEY }}
              run: python .github/scripts/archive_pypi_downloads.py
