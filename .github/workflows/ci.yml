name: ODGS Conformance & Cross-Language Parity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-conformance:
    name: Python Engine & ISO Conformance (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python conformance and cryptographic test suite
        run: |
          python -m pytest tests/ 2_INFORMATIVE_REFERENCE/tests/python/ -v --tb=short

      - name: Run dataspace & enterprise verification scenarios
        run: |
          python examples/run_all_dataspace_scenarios.py
          python examples/verify_real_life_enterprise_use_cases.py

  nodejs-parity:
    name: Node.js Cross-Language Parity (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node.js dependencies
        run: npm install

      - name: Run Node.js interceptor & JCS parity tests
        run: npm test

  docs-strict-check:
    name: MkDocs Strict Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material and build strictly
        run: |
          pip install mkdocs-material
          mkdocs build --strict
